<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Python Project: a chatbot that answers anything about Python">
<style>
.mark{transform-box:fill-box;transform-origin:left center;animation:mark 6s cubic-bezier(.6,0,.2,1) infinite}
@keyframes mark{0%,8%{transform:scaleX(0)}22%,80%{transform:scaleX(1)}92%,100%{transform:scaleX(0)}}
.q{animation:q 6s ease infinite}@keyframes q{0%,6%{opacity:0}14%,84%{opacity:1}94%,100%{opacity:0}}
.dot{animation:dot 1.1s ease-in-out infinite;transform-box:fill-box}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-6px);opacity:1}}
.fade{animation:fade .9s ease-out both}.d1{animation-delay:.15s}.d2{animation-delay:.3s}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1200" height="420" fill="#fbfbf9"/>
<path d="M0 418h1200" stroke="#16181d" stroke-width="4"/>
<g class="fade"><g transform="translate(80 78) scale(2.0625)"><rect width="64" height="64" rx="14" fill="#ffd43b"/><path d="M22 15h13a10.5 10.5 0 0 1 0 21H22" fill="#16181d"/><path d="M28 21h7a4.5 4.5 0 0 1 0 9h-7Z" fill="#ffd43b"/><path d="M16 15h12v25l-12 10Z" fill="#16181d"/></g></g>
<text class="fade d1" x="250" y="160" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="86" font-weight="900" letter-spacing="-3" fill="#16181d">Python Project</text>
<text class="fade d2" x="254" y="212" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#383b44">The chatbot that answers anything about Python. Instantly. Honestly.</text>
<g transform="translate(254 270)">
  <rect class="mark" x="-10" y="-34" width="360" height="48" rx="5" fill="#ffd43b"/>
  <text class="q" x="0" y="0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#16181d">how do I reverse a list?</text>
  <g transform="translate(380 -12)">
    <rect class="dot" x="0" y="0" width="12" height="12" rx="2" fill="#16181d"/>
    <rect class="dot" x="22" y="0" width="12" height="12" rx="2" fill="#16181d" style="animation-delay:.15s"/>
    <rect class="dot" x="44" y="0" width="12" height="12" rx="2" fill="#16181d" style="animation-delay:.3s"/>
  </g>
</g>
<text x="254" y="356" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="20" fill="#6b6f78">170 answers · 560+ ways to ask · runs in your browser · no sign-up</text>
</svg>
